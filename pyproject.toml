[build-system]
requires = ["setuptools>=69,<80"]
build-backend = "setuptools.build_meta"

[project]
name = "home-battery-surplus-forecast"
version = "0.1.0"
description = "Home Assistant solar, consumption, and battery surplus forecasts"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.10,<3",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "lightgbm>=4.6,<5",
  "pvlib>=0.13,<1",
  "websockets>=14,<16",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
energy_forecast = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
