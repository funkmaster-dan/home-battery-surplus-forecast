services:
  app:
    build: .
    image: home-battery-surplus-forecast:latest
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      ENERGY_FORECAST_DATA_DIR: /data
      LLM_API_TOKEN: ${LLM_API_TOKEN:?Set LLM_API_TOKEN in the deployment environment}
      HA_INTEGRATION_TOKEN: ${HA_INTEGRATION_TOKEN:?Set HA_INTEGRATION_TOKEN in the deployment environment}
      OPEN_METEO_RUNTIME_MODEL: ${OPEN_METEO_RUNTIME_MODEL:-auto}
    volumes:
      - energy_forecast_data:/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true

volumes:
  energy_forecast_data:
